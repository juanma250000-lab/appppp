org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.tooling.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# KSP (Room) is not yet compatible with AGP 9 built-in Kotlin, so we opt out and
# apply the Kotlin Android plugin explicitly. The classic Kotlin Android plugin
# needs the pre-9 DSL, hence newDsl=false. Remove both flags once KSP supports
# built-in Kotlin.
android.builtInKotlin=false
android.newDsl=false

kotlin.code.style=official
